<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Caterina Tahan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Caterina Tahan</a>
        <button class="menu-toggle" id="menuToggle">[+]</button>
        <nav id="nav">
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="contact-page">
        <form class="contact-form" action="https://formspree.io/f/mzddpved" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <div class="input-wrapper">
                    <input type="text" id="name" name="name" required>
                    <span class="input-line"></span>
                    <span class="error-message">Please fill out this field</span>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" required>
                    <span class="input-line"></span>
                    <span class="error-message">Please enter a valid email</span>
                </div>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <div class="input-wrapper">
                    <textarea id="message" name="message" rows="5" required></textarea>
                    <span class="input-line"></span>
                    <span class="error-message">Please fill out this field</span>
                </div>
            </div>
            <button type="submit" class="submit-btn">Send</button>
        </form>
        <div class="thank-you-overlay">
            <div class="thank-you-center">Thank you.</div>
            <div class="thank-you-images"></div>
        </div>
    </main>

    <footer>
        <p>© 2025 Caterina Tahan. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
